<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Student ID...</title>
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .message { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top: 4px solid #1e3a8a; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>
    <div class="message" id="status-container">
        <div class="spinner" id="spinner"></div>
        <h2 id="status-text" style="color: #1e3a8a;">Securely Verifying Record...</h2>
        <p style="color: #6b7280; font-size: 14px;">Please wait while we fetch the student details.</p>
    </div>

    <script>
        // DOMAIN LOCKING LOGIC
        const allowedDomain = "https://upen123-tech.github.io";
        const currentDomain = window.location.hostname;
        
        // Active Google Apps Script Web App Endpoint
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzbKfK__d2b8Z1_UEiCmT7sxGK-Ob3fbZFsHlVSWswDgPiaa1YqqrbjXgPa4LDiuIJX/exec";

        if (currentDomain !== allowedDomain && currentDomain !== "localhost" && currentDomain !== "127.0.0.1" && currentDomain !== "") {
            // Block execution if hosted on a cloned/unauthorized domain
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status-text').innerHTML = "Access Denied";
            document.getElementById('status-text').className = "error";
            document.getElementById('status-container').innerHTML += "<p class='error'>Unauthorized domain detected. This verification portal can only be accessed via the official college URL.</p>";
        } else {
            // If domain is valid, grab the QR tokens from URL and forward to Apps Script
            const params = window.location.search;
            if(params) {
                window.location.replace(WEB_APP_URL + params);
            } else {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('status-text').innerHTML = "Invalid Request";
                document.getElementById('status-text').className = "error";
            }
        }
    </script>
</body>
</html>
